<style>
/* Layout: one-column phone app, sticky header with sync status, content cards, fixed 6-tab bar, "المزيد" tab opens a grid of sections. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#E3E8F1; --fg:#0D1424; --muted:#5B667D; --line:#D3DAE7;
  --accent:#2748F0; --accent-fg:#FFFFFF; --flame:#E85F0C; --ok:#0F8F58; --danger:#C93A3A;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E18; --surface:#131A2A; --surface2:#1C2539; --fg:#EAEFFA; --muted:#97A3BD; --line:#26324B;
  --accent:#7C93FF; --accent-fg:#0A0E18; --flame:#FF8A3D; --ok:#3DD598; --danger:#FF7A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E18; --surface:#131A2A; --surface2:#1C2539; --fg:#EAEFFA; --muted:#97A3BD; --line:#26324B;
  --accent:#7C93FF; --accent-fg:#0A0E18; --flame:#FF8A3D; --ok:#3DD598; --danger:#FF7A7A; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-block:0 92px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px;gap:10px}
.logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.5px;direction:ltr}
.logo b{color:var(--accent);font-weight:700}
.date{color:var(--muted);font-size:12px;text-align:left}
h2{font-family:var(--display);font-size:20px;margin:18px 2px 10px;font-weight:600;text-wrap:balance}
h3{font-family:var(--display);font-size:16px;margin:0 0 8px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.alt{background:var(--surface2);color:var(--fg)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-height:42px}
textarea{resize:vertical;min-height:70px}
input,select,textarea{font-size:16px}
input[type=checkbox]{width:22px;min-height:22px;flex:none}
.card.btnlike{display:block;width:100%;text-align:right;color:var(--fg)}
.pill.bad{background:var(--danger);color:var(--bg)}
.pill.good{background:var(--ok);color:var(--bg)}
.code{font-family:var(--display);font-size:40px;letter-spacing:6px;direction:ltr;text-align:center;font-weight:700;margin:6px 0}
.msgs{max-height:280px;overflow-y:auto}
.linkbtn{background:none;border:0;color:var(--accent);padding:6px 0;font-weight:600}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.streak{display:flex;align-items:center;gap:14px}
.flame{font-family:var(--display);font-size:46px;font-weight:700;color:var(--flame);line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{text-align:center;font-size:11px;color:var(--muted)}
.dot{height:30px;border-radius:8px;background:var(--surface2);margin-bottom:4px;display:grid;place-items:center;font-size:12px}
.dot.on{background:var(--flame);color:var(--bg)}
.dot.today{outline:2px solid var(--accent);outline-offset:1px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--ok)}
.colhead,.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.colhead{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
.setrow{margin-top:8px}
.setrow .n{color:var(--muted);text-align:center;font-family:var(--display)}
.setrow input{text-align:center;font-family:var(--display)}
.setrow.done input{background:var(--surface2);color:var(--muted)}
.setrow.pr .n{color:var(--flame);font-weight:700}
.chk{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.rest{position:sticky;top:6px;z-index:5;background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.rest .btn{background:var(--accent-fg);color:var(--accent)}
.stat{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-family:var(--display);font-size:24px;line-height:1.1}
.frow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;font-size:15px}
.frow:first-child{border-top:0}
.flist{max-height:360px;overflow-y:auto;overscroll-behavior:contain}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.x{background:none;border:0;color:var(--muted);padding:6px;font-size:18px;line-height:1}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;min-height:48px}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90%}
.modal{position:fixed;inset:0;background:rgba(5,8,16,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:600;flex:none}
.tag{font-size:11px;background:var(--surface2);color:var(--muted);border-radius:6px;padding:1px 7px}
.wchart{direction:ltr;width:100%;overflow:hidden}
.wchart svg{display:block}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--accent)}
.tx{fill:var(--muted);font-size:11px;font-family:var(--display)}
.ax{stroke:var(--line)}
.vols{display:flex;align-items:flex-end;gap:8px;height:120px;direction:ltr}
.vols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11px;color:var(--muted);min-width:0}
.vols i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.vols i.fl{background:var(--flame)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right;min-height:84px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:15px;font-weight:600}
.back{background:none;border:0;color:var(--accent);padding:12px 2px 0;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-size:13px;padding:0}
.cal button.e{visibility:hidden}
.cal button.w{background:var(--flame);color:var(--bg);border-color:var(--flame)}
.cal button.c{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.cal button.w.c{background:linear-gradient(135deg,var(--flame) 50%,var(--ok) 50%)}
.cal button.t{outline:2px solid var(--accent)}
.cal button.s{box-shadow:0 0 0 3px var(--accent)}
.badge{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.badge:first-child{border-top:0}
.medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none;font-family:var(--display);font-weight:700}
.badge.on .medal{background:var(--flame);color:var(--bg)}
.badge:not(.on){opacity:.6}
.bub{padding:10px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.u{background:var(--accent);color:var(--accent-fg);align-self:flex-start}
.bub.a{background:var(--surface2);align-self:flex-end}
.big{font-family:var(--display);font-size:44px;font-weight:700;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.sync{font-size:11px;color:var(--muted)}
.sync.ok{color:var(--ok)}
.sync.err{color:var(--danger)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;background:var(--surface2);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>
</head>

</div>

function buildChunks(){
  const c={};
  c.core={updated:S.updated,wu:S.wu,profile:S.profile,routines:S.routines,customEx:S.customEx,water:S.water,sleep:S.sleep,mood:S.mood,weights:S.weights,measures:S.measures,habits:S.habits,favFoods:S.favFoods,customFoods:S.customFoods,ach:S.ach,settings:S.settings};
  S.workouts.forEach(w=>{const k='w-'+w.date.slice(0,7);(c[k]=c[k]||{items:[]}).items.push(w)});
  S.cardio.forEach(w=>{const k='c-'+w.date.slice(0,7);(c[k]=c[k]||{items:[]}).items.push(w)});
  Object.keys(S.meals).forEach(d=>{if(!S.meals[d].length)return;const k='m-'+d.slice(0,7);(c[k]=c[k]||{days:{}}).days[d]=S.meals[d]});
  return c;
}
function makeSummary(){
  const ws=weekStats(),si=streakInfo();
  const dates=[...activeDates()].sort();
  let kc=0,nd=0;
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const t=dayTotals(dkey(d)).k;if(t){kc+=t;nd++}}
  return {ts:Date.now(),lastActive:dates[dates.length-1]||'',streak:si.n,weekN:ws.n,weekGoal:+S.profile.weekGoal||4,weekVol:Math.round(ws.vol),
    weight:S.weights.length?S.weights[S.weights.length-1].kg:S.profile.weight,kcalAvg:nd?Math.round(kc/nd):0,workouts:S.workouts.length};
}
function schedSync(){
  if(!C.user||!CLOUD||isCoach())return;
  sync.st='saving';setSync();clearTimeout(sync.timer);sync.timer=setTimeout(runSync,1500);
}
async function runSync(){
  if(!C.user||!CLOUD||isCoach())return;
  if(sync.busy){sync.timer=setTimeout(runSync,1000);return}
  sync.busy=true;
  try{
    const uid=C.user.uid,c=buildChunks();
    for(const id of Object.keys(c)){const x=JSON.stringify(c[id]);if(sync.last[id]!==x){await CLOUD.writeChunk(uid,id,c[id]);sync.last[id]=x}}
    for(const id of Object.keys(sync.last)){if(!c[id]){await CLOUD.deleteChunk(uid,id);delete sync.last[id]}}
    const sm=makeSummary();
    await CLOUD.setProfile(uid,{summary:sm,name:S.profile.name});
    if(C.profile)C.profile.summary=sm;
    S.lastSync=Date.now();saveLocal();sync.st='ok';
  }catch(e){sync.st='err'}
  sync.busy=false;setSync();
  const el=$('#lastsync');if(el)el.textContent=S.lastSync?ago(S.lastSync):'لسه';
}
function applyChunksTo(T,docs){
  const core=docs.core;if(!core)return false;
  ['profile','routines','customEx','water','sleep','mood','weights','measures','habits','favFoods','customFoods','ach','settings'].forEach(k=>{if(core[k]!==undefined)T[k]=core[k]});
  T.profile=Object.assign(defState().profile,T.profile);
  T.wu=core.wu||'cups';if(T.wu!=='ml'&&!(+T.profile.waterGoal>0)){const pg=core.profile&&+core.profile.waterGoal;T.profile.waterGoal=pg>0?pg:8}migWater(T);
  T.updated=core.updated||0;
  const w=[],c=[],m={};
  Object.keys(docs).forEach(id=>{const d=docs[id];
    if(id.startsWith('w-'))w.push(...(d.items||[]));
    else if(id.startsWith('c-'))c.push(...(d.items||[]));
    else if(id.startsWith('m-'))Object.assign(m,d.days||{});});
  T.workouts=w.sort((a,b)=>a.ts-b.ts);T.cardio=c.sort((a,b)=>a.ts-b.ts);T.meals=m;
  return true;
}
async function loadCloud(){
  let docs;
  try{docs=await CLOUD.readChunks(C.user.uid)}catch(e){sync.st='err';setSync();return}
  if(docs.core&&(docs.core.updated||0)>=(S.updated||0)){
    applyChunksTo(S,docs);saveLocal();
    Object.keys(docs).forEach(id=>{sync.last[id]=JSON.stringify(docs[id])});
    sync.st='ok';applyTheme();
  }else{
    S.updated=S.updated||Date.now();sync.st='saving';setSync();await runSync();
  }
  setSync();
}

function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+1)%7));return x}
const wkKey=()=>dkey(weekStart(new Date()));
function activeDates(){const s=new Set();S.workouts.forEach(w=>s.add(w.date));S.cardio.forEach(w=>s.add(w.date));return s}
function streakInfo(){
  const set=activeDates();let d=new Date(),n=0;
  if(!set.has(dkey(d)))d.setDate(d.getDate()-1);
  while(set.has(dkey(d))){n++;d.setDate(d.getDate()-1)}
  const arr=[...set].sort();let best=0,cur=0,prev=null;
  arr.forEach(k=>{const dt=parseKey(k);if(prev&&Math.round((dt-prev)/864e5)===1)cur++;else cur=1;if(cur>best)best=cur;prev=dt});
  return{n,set,best};
}
function weekDots(set){

    h+='<div class="day"><div class="dot'+(set.has(k)?' on':'')+(k===dkey()?' today':'')+'">'+(set.has(k)?'✓':'')+'</div>'+L[i]+'</div>'}

function targets(P,plan){
  const p=P||S.profile;const pl=P?plan:activePlan();
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  let kcal=bmr*p.act+({cut:-400,maintain:0,bulk:300}[p.goal]||0);
  kcal=Math.round(kcal/10)*10;
  const pr=Math.round(p.weight*2),fat=Math.round(p.weight*0.8);
  const o=(pl&&pl.targets)||{};
  if(+o.kcal>0)kcal=Math.round(+o.kcal);
  const pp=+o.p>0?Math.round(+o.p):pr,ff=+o.f>0?Math.round(+o.f):fat;
  const cc=+o.c>0?Math.round(+o.c):Math.max(0,Math.round((kcal-pp*4-ff*9)/4));
  return{kcal,p:pp,f:ff,c:cc,bmr:Math.round(bmr),coach:!!(+o.kcal>0||+o.p>0||+o.f>0||+o.c>0)};
}

function foodMatches(q,cat,noCustom){
  const qq=norm(q);
  const all=(noCustom?[]:S.customFoods.map(custFood)).concat(FOODS);
  let L=all.filter(f=>{
    if(cat==='fav'&&!S.favFoods.includes(f.n))return false;
    if(cat==='mine'&&f.cat!=='mine')return false;
    if(cat&&!['all','fav','mine'].includes(cat)&&f.cat!==cat)return false;
    return !qq||f.q.includes(qq)});
  const rank=f=>(S.favFoods.includes(f.n)?0:2)+(qq&&f.q.split(/\s+/).some(w=>w.startsWith(qq))?0:1);
  return L.map((f,i)=>[f,i]).sort((a,b)=>rank(a[0])-rank(b[0])||a[1]-b[1]).map(x=>x[0]);

  h=h||130;const W=320,P=18;const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}
  const xy=pts.map((p,i)=>[P+i*(W-2*P)/(pts.length-1),h-P-(p.y-mn)/(mx-mn)*(h-2*P)]);
  const last=pts[pts.length-1];
  return '<div class="wchart"><svg viewBox="0 0 '+W+' '+h+'" width="100%" role="img" aria-label="رسم بياني"><line class="ax" x1="'+P+'" y1="'+(h-P)+'" x2="'+(W-P)+'" y2="'+(h-P)+'"/>'+
   '<polyline class="ln" points="'+xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>'+xy.map(p=>'<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5"/>').join('')+
   '<text class="tx" x="'+P+'" y="12">'+f1(mx)+'</text><text class="tx" x="'+P+'" y="'+(h-3)+'">'+f1(mn)+'</text><text class="tx" x="'+(W-P)+'" y="12" text-anchor="end">'+f1(last.y)+'</text></svg></div>';
}

  const from=new Date();from.setDate(from.getDate()-30);const fk=dkey(from);const cnt={};
  S.workouts.filter(w=>w.date>=fk).forEach(w=>w.exercises.forEach(e=>{const m=(exOf(e.ex)||{}).m;if(m)cnt[m]=(cnt[m]||0)+e.sets.length}));
  const mk=MUSCLES.filter(m=>cnt[m]);
  h+='<div class="card"><h3>مجموعات لكل عضلة (30 يوم)</h3>'+(mk.length?bars(mk.map(m=>cnt[m]),mk):'<div class="muted">هتظهر بعد أول تمرين.</div>')+'</div>';
  /* per-exercise 1RM */
  const done=[...new Set(S.workouts.flatMap(w=>w.exercises.map(e=>e.ex)))];
  if(done.length){
    const cur=U.pex&&done.includes(U.pex)?U.pex:done[0];
    const pts=[];S.workouts.forEach(w=>{let b=0;w.exercises.forEach(e=>{if(e.ex===cur)e.sets.forEach(s=>{const v=est1(+s.kg||0,+s.reps||0);if(v>b)b=v})});if(b)pts.push({y:Math.round(b*10)/10})});
    h+='<div class="card"><h3>قوتك في تمرين (1RM تقديري)</h3><select id="pexsel" aria-label="التمرين">'+done.map(id=>'<option value="'+esc(id)+'"'+(id===cur?' selected':'')+'>'+esc(exName(id))+'</option>').join('')+'</select>'+(pts.length>=2?line(pts):'<div class="muted" style="margin-top:8px">محتاج تمرينتين على الأقل.</div>')+'</div>';
  }
  const best={};
  S.workouts.forEach(w=>w.exercises.forEach(e=>e.sets.forEach(s=>{const kg=+s.kg||0,r=+s.reps||0;if(!kg||!r)return;const rm=est1(kg,r);if(!best[e.ex]||rm>best[e.ex].rm)best[e.ex]={rm,kg,r}})));
  const ids=Object.keys(best).sort((a,b)=>best[b].rm-best[a].rm).slice(0,8);
  h+='<div class="card"><h3>أرقامك القياسية</h3>'+(ids.length?ids.map(id=>'<div class="item"><div class="grow">'+esc(exName(id))+'</div><span class="num"><b>'+best[id].kg+'</b> كجم × '+best[id].r+'</span></div>').join(''):'<div class="muted">هتظهر هنا بعد أول تمرين.</div>')+'</div>';
  return h;
}

async function afterLogin(user){
  if(!user){C.plan=null;try{localStorage.removeItem('hassanfit.plan')}catch(e){}syncPlanProgram();C.user=null;C.profile=null;C.msgs=[];C.clients=[];stopWatchers();sync.st='local';sync.last={};U.cc={tab:'clients',sel:null,detail:null,msgs:[],unMsg:null};render();return}
  C.user=user;
  try{
    let pr=await CLOUD.profile(user.uid);
    if(!pr){pr=Object.assign({role:'client',name:S.profile.name,email:user.email,createdAt:Date.now()},U.pending||{});U.pending=null;await CLOUD.setProfile(user.uid,pr)}
    C.profile=pr;
    if(pr.role==='coach'){
      if(!pr.code)await ensureCode();
      stopWatchers();
      CLOUD.watchClients(user.uid,list=>{C.clients=list;if(isCoach()&&U.cc.tab==='clients'&&!U.cc.sel)renderCoachApp()}).then(u=>C.unsubs.push(u)).catch(()=>{});
    }else{
      if(S.owner&&S.owner!==user.uid){const th=S.settings;S=defState();S.settings=th;sync.last={};C.plan=null;syncPlanProgram();applyTheme()}
      S.owner=user.uid;saveLocal();
      await loadCloud();
      stopWatchers();
      CLOUD.watchMessages(user.uid,m=>{C.msgs=m;updateMsgs()}).then(u=>C.unsubs.push(u)).catch(()=>{});
      CLOUD.watchPlan(user.uid,p=>{applyPlan(p);render()}).then(u=>C.unsubs.push(u)).catch(()=>{});
    }
  }catch(e){toast('تعذر الاتصال بالسيرفر')}
  render();
}
async function ensureCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for(let t=0;t<8;t++){
    let code='';for(let i=0;i<6;i++)code+=A[Math.floor(Math.random()*A.length)];
    if(await CLOUD.coachByCode(code))continue;
    await CLOUD.createCode(code,C.user.uid,C.profile.name);
    await CLOUD.setProfile(C.user.uid,{code});C.profile.code=code;return;
  }
  throw new Error('code');
}

  if(U.authBusy)return;

async function saveClientPlan(){
  const e=U.cc.edit,c=U.cc.sel;if(!e||!c)return;
  const num=v=>{const n=pf(v);return n>0?n:0};
  const tg=e.targets||{};
  const plan={updated:Date.now(),targets:{kcal:num(tg.kcal),p:num(tg.p),c:num(tg.c),f:num(tg.f),waterL:num(tg.waterL)},weekGoal:num(e.weekGoal),
    trainDays:e.trainDays||[],note:(e.note||'').trim(),
    meals:(e.meals||[]).map(x=>({id:x.id,meal:x.meal,name:x.name,fid:x.fid||'',g:+x.g||0,u:x.u||'',k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0})),program:null};

  if(pg&&pg.days.length){
    const days=pg.days.map((x,i)=>({n:(x.n||'').trim()||('يوم '+(i+1)),ex:x.ex.slice()})).filter(x=>x.ex.length);
    if(days.length)plan.program={name:(pg.name||'').trim(),sets:num(pg.sets),days};

}

function toolCalc(){
  const o=$('#t_out');if(!o)return;
  if(U.tool==='1rm'){
    const kg=parseFloat($('#t_kg').value),r=parseInt($('#t_r').value);
    if(!(kg>0&&r>0)){o.innerHTML='<div class="muted">اكتب الوزن والعدّات.</div>';return}
    const e=kg*(1+r/30),b=r<37?kg*36/(37-r):0;const rm=Math.round(((e+(b||e))/2)*10)/10;
    o.innerHTML='<div class="stat" style="margin-bottom:10px"><b>'+f1(rm)+' كجم</b><span>أقصى وزن لمرة واحدة (تقديري)</span></div>'+[95,90,85,80,75,70,60].map(p=>'<div class="item"><div class="grow">'+p+'%</div><b class="num">'+f1(rm*p/100)+' كجم</b></div>').join('');
  }else if(U.tool==='plates'){
    const kg=parseFloat($('#t_kg').value),bar=parseFloat($('#t_bar').value);
    if(!(kg>bar)){o.innerHTML='<div class="muted">اكتب وزن أكبر من وزن البار.</div>';return}
    let side=(kg-bar)/2;const out=[];[25,20,15,10,5,2.5,1.25].forEach(p=>{let c=0;while(side>=p-1e-9){side-=p;c++}if(c)out.push(c+' × '+p)});
    o.innerHTML='<div class="stat"><b>'+(out.join(' + ')||'—')+'</b><span>على كل جنب'+(side>0.01?' (فاضل '+f1(side*2)+' كجم مش متاح)':'')+'</span></div>';
  }else if(U.tool==='fat'){
    const p=S.profile,w=parseFloat($('#t_w').value),n=parseFloat($('#t_n').value),hp=$('#t_h')?parseFloat($('#t_h').value):0;
    let v=NaN;
    if(w>0&&n>0&&w>n){if(p.sex==='m')v=495/(1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(p.height))-450;else if(hp>0)v=495/(1.29579-0.35004*Math.log10(w+hp-n)+0.221*Math.log10(p.height))-450}
    o.innerHTML=isFinite(v)&&v>0&&v<60?'<div class="stat"><b>'+f1(v)+'%</b><span>نسبة الدهون التقديرية · كتلة خالية من الدهون '+f1(p.weight*(1-v/100))+' كجم</span></div>':'<div class="muted">اكتب القياسات لحساب النسبة.</div>';
  }
}

/* ================= timers ================= */
function tick(){
  const el=$('#elapsed');if(el&&S.active)el.textContent=mmss((Date.now()-S.active.start)/1000);
  if(U.rest){
    const left=(U.rest-Date.now())/1000;
    if(left<=0){U.rest=null;const b=$('#restbar');if(b)b.hidden=true;toast('خلصت الراحة، كمّل');beep(880,.25);vib(250)}
    else{const t=$('#resttime');if(t)t.textContent=mmss(left)}
  }
  const t=U.tm;
  if(t.running){
    const now=Date.now();t.left-=(now-t.last)/1000;t.last=now;
    if(t.left<=0){
      if(t.phase==='شغل'&&t.rest>0){t.phase='راحة';t.left=t.rest;beep(520,.3);vib(150)}
      else{t.round++;if(t.round>t.rounds){t.running=false;t.phase='خلصت';t.left=0;beep(1046,.6);vib(500);if(S.tab==='more'&&S.sub==='tools'&&U.tool==='interval')render()}else{t.phase='شغل';t.left=t.work;beep(988,.3);vib(150)}}
    }
    const v=$('#tmv');if(v)v.textContent=mmss(t.left);const p=$('#tmp');if(p)p.textContent=t.phase;const r=$('#tmr');if(r)r.textContent='جولة '+Math.min(t.round,t.rounds)+' / '+t.rounds;
  }
  if(U.sw.run){const v=$('#swv');if(v)v.textContent=mmss((U.sw.acc+Date.now()-U.sw.start)/1000)}
}

function download(name,data){
  try{
    const blob=new Blob([data],{type:name.endsWith('.csv')?'text/csv;charset=utf-8':'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();

  }catch(e){toast('تعذر التنزيل')}
}

   case 'cpreset':{const k=$('#cpreset').value,e=U.cc.edit;if(k==='__empty')e.program={name:'',sets:'',days:[{n:'يوم 1',ex:[]}]};else{const pr=PROGRAMS[k];e.program={name:pr.n,sets:pr.sets||'',days:pr.days.map(x=>({n:x.n,ex:x.ex.slice()}))}}renderCoachApp();break}
   case 'cdayadd':{const pg=U.cc.edit.program;pg.days.push({n:'يوم '+(pg.days.length+1),ex:[]});renderCoachApp();break}
   case 'cdayrm':U.cc.edit.program.days.splice(+d.i,1);renderCoachApp();break;
   case 'cexrm':U.cc.edit.program.days[+d.i].ex.splice(+d.j,1);renderCoachApp();break;
   case 'cexadd':U.pi=+d.i;U.pickMode='cplan';U.pq='';U.pm='الكل';U.modal='picker';renderLayer();break;
   case 'cprogclear':U.cc.edit.program=null;renderCoachApp();break;
   case 'cmeal':U.cc.meal=d.v;renderCoachApp();break;
   case 'cmdel':U.cc.edit.meals=U.cc.edit.meals.filter(x=>x.id!==d.id);renderCoachApp();break;
   case 'cfood':{const f=findFood(d.n);if(!f)break;const g=pf($('#cfq')&&$('#cfq').value)||100;U.cc.fqty=String(g);const x=calcFood(f,g);U.cc.edit.meals.push({id:uid(),meal:U.cc.meal||'فطار',name:f.n,fid:f.n,g,u:f.u,k:x.k,p:x.p,c:x.c,f:x.f});renderCoachApp();toast('اتضافت');break}
   case 'cmadd':{const n=($('#ccn').value||'').trim(),k=parseFloat($('#cck').value);if(!n||!(k>=0)){toast('اكتب الاسم والسعرات');break}U.cc.edit.meals.push({id:uid(),meal:U.cc.meal||'فطار',name:n,k:Math.round(k),p:parseFloat($('#ccp').value)||0,c:parseFloat($('#ccc').value)||0,f:parseFloat($('#ccf').value)||0});renderCoachApp();break}
   case 'logplan':{const pl=activePlan(),x=((pl&&pl.meals)||[]).find(y=>y.id===d.id);if(x){const e=planItemMeal(x);addMeal(e,e.meal);toast('اتسجّل')}break}
   case 'logplanmeal':{const pl=activePlan(),k=dkey();((pl&&pl.meals)||[]).filter(y=>y.meal===d.v).forEach(x=>(S.meals[k]=S.meals[k]||[]).push(planItemMeal(x)));save();render();toast('اتسجّلت الوجبة');break}
   case 'editmeal':{const k=dkey(),x=dayMeals(k).find(y=>y.id===d.id);if(x){U.em={id:x.id,date:k,name:mealName(x),orig:mealName(x),g:x.g||0,u:x.u||'g',b:x.b||null,fid:x.fid||'',k:x.k,p:x.p,c:x.c,f:x.f,meal:x.meal};U.modal='editmeal';renderLayer()}break}
   case 'emeal':emSync();U.em.meal=d.v;renderLayer();break;
   case 'emsave':{emSync();const e=U.em;if(!e.name.trim()){toast('اكتب اسم الأكلة');break}const x=(S.meals[e.date]||[]).find(y=>y.id===e.id);if(x){if(e.name.trim()!==e.orig){x.name=e.name.trim();delete x.fid}else if(!x.fid)x.name=e.name.trim();if(e.g>0&&x.g)x.g=e.g;x.k=e.k;x.p=e.p;x.c=e.c;x.f=e.f;x.meal=e.meal}U.modal=null;U.em=null;save();render();toast('اتعدّلت');break}
   case 'editw':{const w=S.workouts.find(x=>x.id===d.id);if(w){U.ew=JSON.parse(JSON.stringify(w));U.modal='editw';renderLayer()}break}
   case 'ewadd':{ewSync();const e=U.ew.exercises[+d.i],l=e.sets[e.sets.length-1]||{kg:'',reps:''};e.sets.push({kg:l.kg,reps:l.reps});renderLayer();break}
   case 'ewdel':{ewSync();const e=U.ew.exercises[+d.i];if(e.sets.length>1)e.sets.pop();renderLayer();break}
   case 'ewrm':{ewSync();U.ew.exercises.splice(+d.i,1);renderLayer();break}
   case 'ewsave':{ewSync();const w=U.ew;const ex=w.exercises.map(e=>({ex:e.ex,sets:e.sets.map(s=>({kg:+s.kg||0,reps:+s.reps||0,pr:!!s.pr}))})).filter(e=>e.sets.length);
     if(!ex.length){toast('لازم يفضل تمرين واحد على الأقل');break}
     const x=S.workouts.find(y=>y.id===w.id);
     if(x){x.name=(w.name||'').trim()||x.name;x.note=(w.note||'').trim();x.exercises=ex;x.sets=ex.reduce((a,e)=>a+e.sets.length,0);x.volume=ex.reduce((a,e)=>a+e.sets.reduce((t,q)=>t+q.kg*q.reps,0),0);x.prs=ex.reduce((a,e)=>a+e.sets.filter(q=>q.pr).length,0)}
     U.modal=null;U.ew=null;save();render();toast('اتعدّل التمرين');break}
   case 'cback':U.cc.edit=null;closeClient();U.cc.sel=null;U.cc.detail=null;renderCoachApp();break;
   case 'csend':sendMsg('coach',U.cc.sel&&U.cc.sel.uid);break;
   case 'copyinv':copyInv();break;
   case 'install':installApp();break;
   case 'hideinstall':S.settings.hideInstall=true;saveLocal();render();break;
  }
});
document.addEventListener('input',function(ev){
  const t=ev.target;
  if(t.dataset.k&&S.active){const s=S.active.exercises[+t.dataset.i].sets[+t.dataset.j];s[t.dataset.k]=t.value;saveLocal();return}
  if(t.dataset.cf&&U.cc.edit){setPath(U.cc.edit,t.dataset.cf,t.value);return}
  if(t.id==='cfsearch'){U.cc.fq=t.value;$('#cflist').innerHTML=cfList(t.value);return}
  if(t.id==='cfq'){U.cc.fqty=t.value;return}
  if(t.dataset.ek&&U.ew){U.ew.exercises[+t.dataset.ei].sets[+t.dataset.ej][t.dataset.ek]=t.value;return}
  if(t.id==='fsearch'){U.fq=t.value;$('#flist').innerHTML=foodList(t.value);return}
  if(t.id==='fg'&&U.fs){U.fs.g=pf(t.value)||0;const c=$('#fcalc');if(c)c.innerHTML=foodCalcHtml();return}
  if(t.id==='em_g'&&U.em&&U.em.b){const g=pf(t.value)||0,r=g/100,b=U.em.b,r1=n=>Math.round(n*10)/10;$('#em_k').value=Math.round(b.k*r);$('#em_p').value=r1(b.p*r);$('#em_c').value=r1(b.c*r);$('#em_f').value=r1(b.f*r);return}
  if(t.id==='psearch'){U.pq=t.value;$('#plist').innerHTML=pickerList(U.pq,U.pm);return}
  if(t.id==='rname'&&U.re){U.re.name=t.value;return}
  if(/^t_/.test(t.id)||false)toolCalc();
});
document.addEventListener('change',function(ev){
  const t=ev.target;
  if(t.dataset.p){
    const k=t.dataset.p;let v=t.value;
    if(['age','height','weight','act','rest','waterL','weekGoal'].includes(k)){v=pf(v);if(!(v>0))return}
    S.profile[k]=v;save();render();return;
  }
  if(t.id==='pexsel'){U.pex=t.value;render();return}
  if(t.id==='t_bar')toolCalc();
});
$('#impf').addEventListener('change',function(ev){
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.profile||!Array.isArray(o.workouts))throw 0;
    const d=defState();S=Object.assign(d,o);S.profile=Object.assign(d.profile,o.profile);S.wu=o.wu||'cups';if(S.wu!=='ml'&&!(o.profile&&+o.profile.waterGoal>0))S.profile.waterGoal=8;migWater(S);S.settings=Object.assign({theme:'auto'},o.settings||{});S.active=null;S.tab='more';S.sub='set';S.updated=Date.now();U.confirmImport=false;applyTheme();save();render();toast('اتستورد الملف')}catch(e){toast('الملف مش نسخة Hassanfit صحيحة')}};
  r.readAsText(f);
});

/* ================= init ================= */
$('#today').textContent=AR(new Date(),{weekday:'long',day:'numeric',month:'long'});
applyTheme();
if(S.active&&S.active.start&&Date.now()-S.active.start>12*3600e3){S.active=null}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();U.deferred=e;if(S.tab==='home'&&!isCoach())render()});
window.addEventListener('appinstalled',()=>{U.deferred=null;S.settings.hideInstall=true;saveLocal()});
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
render();
let started=false;
function startApp(){
  if(started)return;started=true;
  CLOUD=window.Cloud||null;
  if(CLOUD&&CLOUD.configured){CLOUD.onAuth(u=>{afterLogin(u)})}
}
if(window.Cloud)startApp();
else{window.addEventListener('cloud-ready',startApp);setTimeout(startApp,4000)}
window.__hf={get S(){return S},FOODS,get LANG(){return LANG}};
})();
</script>
